name: Overnight Tasks

on:
  # Run every night at midnight EST (5:00 AM UTC)
  schedule:
    - cron: '0 5 * * *'

  # Allow manual triggering from the GitHub Actions UI
  workflow_dispatch:

  # Allow triggering via webhook (POST to the repository_dispatch endpoint)
  repository_dispatch:
    types: [run-tasks]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  process-tasks:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code on tonight's tasks
        id: tasks
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_tools: "Bash(gh *),Bash(cat *),Read,Write,Edit,Glob,Grep"
          prompt: |
            Read the CLAUDE.md file in this repository for context about who you're working for and how to behave.

            Now, find all open GitHub Issues in this repository that have the label "tonight".

            For each issue:
            1. Read the issue title and body carefully to understand what task is being requested.
            2. Complete the task to the best of your ability.
               - If the task involves creating or editing files, make the changes on a new branch and open a pull request for Kenny to review. Name the branch after the issue (e.g., issue-5-add-landing-page).
               - If the task is a question or research task, answer it directly in a comment.
            3. After completing the task, post a comment on the issue in plain, non-technical English explaining what you did.
            4. Remove the "tonight" label from the issue.
            5. Add the "done" label to the issue.
            6. If a task is unclear or you need more information, post a comment explaining what you need in simple English, remove the "tonight" label, and add the "needs-input" label instead.

            Important rules:
            - Never delete files unless the issue explicitly says to.
            - Keep all communication simple and non-technical. Kenny is not a developer.
            - If there are no issues labeled "tonight", just report that there were no tasks to process.
            - Work through issues one at a time. Don't skip any.

            CRITICAL: When you are completely done processing all issues, write the email summary
            to a file called "task-summary.txt" using the Write tool.
            Format it exactly like this:
            - Start with the heading "# Overnight Task Summary"
            - Then: "Hey Kenny! Here is what got done today:"
            - For each issue, use a numbered heading with the issue title, then bullet points explaining what was done in plain English.
            - If there were no tasks, just say "No tasks were queued up for tonight — all clear!"
            - End with any issues that need your input (labeled needs-input).

      - name: Send email confirmation
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Overnight Task Summary"
          to: kennygouts@gmail.com
          from: ${{ secrets.SMTP_USERNAME }}
          body: file://task-summary.txt

      - name: Create backup issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = 'Overnight tasks ran but did not produce a summary. Check the Actions log.';
            try {
              body = fs.readFileSync('task-summary.txt', 'utf8');
            } catch (e) {
              // file doesn't exist, use default message
            }
            const today = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Overnight Tasks Summary — ${today}`,
              body: body,
              labels: ['overnight-summary']
            });
